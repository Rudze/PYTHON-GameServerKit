name: Release

# On every push to main: runs the tests, then semantic-release reads the commit messages
# (feat:, fix:...), picks the next version, updates CHANGELOG.md and VERSION, tags and publishes a release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          pip install -r requirements-dev.txt
          pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: semantic-release
        run: >
          npx --yes
          -p semantic-release
          -p @semantic-release/changelog
          -p @semantic-release/git
          -p @semantic-release/exec
          -p conventional-changelog-conventionalcommits@8
          semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
