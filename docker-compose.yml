# Everything at once: PostgreSQL, the API and one game server.
#   cp .env.example .env   (then change JWT_SECRET and POSTGRES_PASSWORD)
#   docker compose up -d --build
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: game
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: game
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game -d game"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    command: python -m api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://game:${POSTGRES_PASSWORD:-change-me}@postgres:5432/game
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  server:
    build: .
    command: python -m server
    env_file: .env
    environment:
      DATABASE_URL: postgresql://game:${POSTGRES_PASSWORD:-change-me}@postgres:5432/game
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
